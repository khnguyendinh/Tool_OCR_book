server:
  port: 8080

spring:
  application:
    name: ocr-book-backend

  servlet:
    multipart:
      max-file-size: 500MB
      max-request-size: 500MB

  datasource:
    url: jdbc:h2:file:./data/ocrbook;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.H2Dialect

  rabbitmq:
    host: localhost
    port: 5672
    username: guest
    password: guest
    listener:
      simple:
        prefetch: 1
        concurrency: 1
        max-concurrency: 1
        retry:
          enabled: true
          max-attempts: 3
          initial-interval: 5000

# OCR Configuration
ocr:
  split-parts: 100
  temp-dir: ./temp/pdf-parts
  output-dir: ./output
  # Để trống: tự tìm %LOCALAPPDATA%\Pandoc\pandoc.exe rồi đến "pandoc" trong PATH
  pandoc-path:
  gemini:
    model: gemini-3.8-flash
    location: global
    # Để trống: lấy project_id từ file key GOOGLE_APPLICATION_CREDENTIALS
    project:
    dpi: 200
